services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bottega
      POSTGRES_PASSWORD: bottega
      POSTGRES_DB: bottega
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottega"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
