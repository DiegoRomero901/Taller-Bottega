name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bottega:bottega@localhost:5432/bottega?schema=public
      AUTH_SECRET: ci-only-secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bottega
          POSTGRES_PASSWORD: bottega
          POSTGRES_DB: bottega
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bottega"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm vitest run --coverage
      - run: pnpm db:deploy
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
